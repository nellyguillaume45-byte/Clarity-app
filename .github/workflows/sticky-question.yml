name: Keep Clarity question visible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticky-question.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mobile-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pin the active question on mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* CLARITY_STICKY_QUESTION_V1 */'
          if marker in s:
              print('Sticky-question fix already present.')
              raise SystemExit(0)

          css_anchor = '    .hidden{display:none!important}\n'
          css = '''

    /* CLARITY_STICKY_QUESTION_V1 */
    #flow.sticky-question .progress-wrap{
      position:sticky;
      top:var(--topbar-h,62px);
      z-index:24;
      height:6px;
      margin:0 -18px;
      border-radius:0;
      background:var(--cream);
    }
    #flow.sticky-question .hero{
      position:sticky;
      top:calc(var(--topbar-h,62px) + 6px);
      z-index:22;
      margin:0 -18px 18px;
      padding:13px 18px 14px;
      background:rgba(253,252,250,.97);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      box-shadow:0 8px 18px rgba(13,27,42,.05);
    }
    #flow.sticky-question .hero .eyebrow{font-size:11px}
    #flow.sticky-question .hero h2{font-size:23px;line-height:1.12;margin:5px 0 6px}
    #flow.sticky-question .hero p{font-size:14px;line-height:1.4;margin-bottom:0}
'''
          if css_anchor not in s:
              raise SystemExit('CSS insertion point not found')
          s = s.replace(css_anchor, css_anchor + css, 1)

          render_anchor = '''  function renderStep(){
    save();
    var step=screens[currentStep];
    var pct=Math.round((currentStep/(screens.length-1))*100);'''
          render_replacement = '''  function syncStickyOffset(){
    var topbar=document.querySelector(".topbar");
    if(topbar) document.documentElement.style.setProperty("--topbar-h",topbar.offsetHeight+"px");
  }
  function renderStep(){
    save();
    var step=screens[currentStep];
    var flow=document.getElementById("flow");
    flow.classList.toggle("sticky-question",step!=="intro" && step!=="summary");
    syncStickyOffset();
    var pct=Math.round((currentStep/(screens.length-1))*100);'''
          if render_anchor not in s:
              raise SystemExit('renderStep insertion point not found')
          s = s.replace(render_anchor, render_replacement, 1)

          end_anchor = '''    bindStep(step);
    updateNextState(step);
  }'''
          end_replacement = '''    bindStep(step);
    updateNextState(step);
    syncStickyOffset();
    requestAnimationFrame(function(){ window.scrollTo(0,0); });
  }'''
          if end_anchor not in s:
              raise SystemExit('renderStep end insertion point not found')
          s = s.replace(end_anchor, end_replacement, 1)

          load_anchor = '''  load();
})();'''
          load_replacement = '''  window.addEventListener("resize",syncStickyOffset);
  load();
  syncStickyOffset();
})();'''
          if load_anchor not in s:
              raise SystemExit('load insertion point not found')
          s = s.replace(load_anchor, load_replacement, 1)

          p.write_text(s, encoding='utf-8')
          print('Sticky-question fix applied.')
          PY

      - name: Commit the fix
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep active question visible on mobile"
          git push
